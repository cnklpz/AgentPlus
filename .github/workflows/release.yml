name: Release

# Pushing a tag like v0.2.0 builds the signed Windows installer and the macOS apps (Apple
# silicon and Intel, one each) and puts them, with the updater's latest.json, on a draft GitHub
# release. Publishing that draft is what makes installed copies see the update (the updater
# reads releases/latest, which skips drafts).
#
# A tag build can only restore caches saved on its own tag or on main, so every new version
# used to compile all dependencies from scratch. The warm-cache job keeps a release-profile
# cache on main instead: it runs when the dependencies change, and twice a week so the cache
# isn't evicted (GitHub drops caches unused for 7 days); with the cache in place it only
# restores it and skips the build.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # Only applies to the branch push; tag pushes ignore path filters.
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - .github/workflows/release.yml
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for every platform: each build job below uploads to it and merges its entry
  # into latest.json (two jobs creating the release themselves would race into two drafts).
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $v (run: npm version <x.y.z>)"
            exit 1
          fi

      - name: Draft release with notes from CHANGELOG.md
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          # The id comes from the create call itself: a new draft doesn't show up in the
          # release list right away, and without an id tauri-action skips every upload.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="AgentPlus $GITHUB_REF_NAME" -F draft=true -F body=@notes.md --jq .id)
          if [ -z "$id" ]; then
            echo "::error::Creating the draft release returned no id"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          # Two jobs side by side rather than one universal build, which compiles both in turn.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target || 'host' }}
          # Filled by warm-cache on main; a tag's own cache would be useless to the next tag.
          save-if: false

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages for the in-app updater; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # latest.json is written once by updater-json below; three jobs merging into it race.
          includeUpdaterJson: false
          # Adds the signed updater artifacts; kept out of tauri.conf.json so local builds need no key.
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config src-tauri/tauri.release.conf.json

  # The updater's latest.json from every platform's .sig, once all of them are uploaded. Rerun
  # the failed build job if one fails; this job then runs by itself.
  updater-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # By release id, like the uploads: looking a draft up by its tag isn't reliable.
      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.id }}
        run: |
          mkdir sigs
          gh api "$RELEASE/assets" --paginate --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done
          node scripts/updater-json.mjs "$GITHUB_REF_NAME" sigs "$GITHUB_REPOSITORY" > latest.json
          # Replaces the one left by a rerun.
          old=$(gh api "$RELEASE/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          gh api -X POST "https://uploads.github.com/$RELEASE/assets?name=latest.json" \
            -H "Content-Type: application/json" --input latest.json --jq .browser_download_url

  # Same toolchain, cache key and cargo invocation as build (keep them in sync), without
  # bundling or uploading.
  warm-cache:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          # Two jobs side by side rather than one universal build, which compiles both in turn.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target || 'host' }}

      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: 20
          cache: npm
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build without bundling
        if: steps.cache.outputs.cache-hit != 'true'
        run: npx tauri build --no-bundle ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config src-tauri/tauri.release.conf.json
