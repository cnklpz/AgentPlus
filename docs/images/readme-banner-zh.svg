<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <title>AgentPlus — 编程 Agent 的 API 配置和模型列表</title>
  <desc>统一的供应商库连接 Codex、Claude Code、OpenCode 和其他编程 Agent。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F5FF"/><stop offset=".55" stop-color="#F8F9FF"/><stop offset="1" stop-color="#E9EAFE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#6874C6" stroke-opacity=".07"/>
    </pattern>
    <symbol id="agentplus-logo" viewBox="0 0 1024 1024">
      <defs>
          <linearGradient id="agentplus-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5B7BFF"/>
            <stop offset="0.55" stop-color="#2F54EB"/>
            <stop offset="1" stop-color="#3423C9"/>
          </linearGradient>
          <linearGradient id="agentplus-gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
            <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="agentplus-ink" gradientUnits="userSpaceOnUse" x1="352" y1="464" x2="552" y2="680">
            <stop offset="0" stop-color="#4D6DFF"/>
            <stop offset="1" stop-color="#3628D2"/>
          </linearGradient>
          <filter id="agentplus-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#10164A" flood-opacity="0.24"/>
          </filter>
        </defs>
      
        <!-- tile -->
        <rect x="80" y="80" width="864" height="864" rx="208" fill="url(#agentplus-bg)"/>
        <rect x="80" y="80" width="864" height="864" rx="208" fill="url(#agentplus-gloss)"/>
      
        <!-- back card: the other agents' configs -->
        <rect x="352" y="232" width="440" height="440" rx="104" fill="#FFFFFF" fill-opacity="0.34"/>
      
        <!-- front card with the plus -->
        <g filter="url(#agentplus-shadow)">
          <rect x="232" y="352" width="440" height="440" rx="104" fill="#FFFFFF"/>
        </g>
        <path d="M452 480V664M360 572H544" stroke="url(#agentplus-ink)" stroke-width="80" stroke-linecap="round" fill="none"/>
    </symbol>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect x="660" width="620" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="974" cy="184" r="149" stroke="#6C77CF" stroke-opacity=".1"/>
  <circle cx="974" cy="184" r="104" stroke="#6C77CF" stroke-opacity=".1"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
    <use href="#agentplus-logo" x="51" y="44" width="35" height="35"/>
    <text x="96" y="67" fill="#5364DA" font-size="13" font-weight="700" letter-spacing="2">桌面应用</text>
    <text x="51" y="158" fill="#1C2345" font-size="68" font-weight="700" letter-spacing="-3">AgentPlus</text>
    <text x="55" y="202" fill="#535D7C" font-size="23">统一管理编程 Agent 的 API 配置和模型列表。</text>
    <g font-size="14" font-weight="600" fill="#4858B8">
      <rect x="54" y="253" width="111" height="36" rx="18" fill="#E3E8FE"/>
      <text x="109.5" y="276" text-anchor="middle">供应商</text>
      <rect x="177" y="253" width="96" height="36" rx="18" fill="#E3E8FE"/>
      <text x="225" y="276" text-anchor="middle">模型</text>
      <rect x="285" y="253" width="108" height="36" rx="18" fill="#E3E8FE"/>
      <text x="339" y="276" text-anchor="middle">本地网关</text>
    </g>
    <g stroke="#9DA8E3" stroke-width="2">
      <path d="M949 140V88H875M998 140V88H1076M949 228V282H875M998 228V282H1076"/>
    </g>
    <g fill="white" stroke="#D9DEF6">
      <rect x="761" y="66" width="162" height="44" rx="12"/>
      <rect x="1025" y="66" width="192" height="44" rx="12"/>
      <rect x="761" y="260" width="162" height="44" rx="12"/>
      <rect x="1025" y="260" width="192" height="44" rx="12"/>
    </g>
    <g fill="#414B72" font-size="15" font-weight="600" text-anchor="middle">
      <text x="842" y="94">Codex</text>
      <text x="1121" y="94">Claude Code</text>
      <text x="842" y="288">OpenCode</text>
      <text x="1121" y="288">其他 Agent</text>
    </g>
    <use href="#agentplus-logo" x="916" y="126" width="116" height="116"/>
    <circle cx="949" cy="135" r="4" fill="#8E9AE2"/>
    <circle cx="998" cy="233" r="4" fill="#8E9AE2"/>
  </g>
</svg>
