[package]
name = "agentplus"
version = "0.2.3"
description = "Manage providers and model lists for coding agents"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "agentplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
regex = "1"
chrono = "0.4"
dirs = "5"
anyhow = "1"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tungstenite = "0.24"
sysinfo = "0.32"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
json5 = "0.4"
deunicode = "1.6.2"
getrandom = "0.2"
plist = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# Already in the tree through Tauri; used to keep App Nap off while a restart waits.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

# Argon2 unoptimized takes seconds per sync export/import in dev builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
# Thin rather than fat: the final link takes about a third of the time for a ~8% larger exe.
lto = "thin"
